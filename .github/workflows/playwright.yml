name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Uncomment to enable scheduled runs (daily at 4 AM UTC)
  # schedule:
  #   - cron: '0 4 * * *'

# Least privilege by default; jobs that need more ask for it explicitly
permissions:
  contents: read

# A newer push to the same PR cancels the older run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22

jobs:
  # Fast gate: dependency audit, undefined/ambiguous Cucumber steps, Playwright spec discovery
  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Validate Test Definitions
        run: npm run check

  test:
    name: Tests
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Only the browsers the suites use (chromium for Cucumber, firefox for Playwright)
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox

      # Playwright runs first: its global setup clears allure-results
      - name: Run Playwright Tests
        run: npm run test:playwright

      # Runs even if Playwright failed, so both suites always report; the job still fails
      - name: Run Cucumber Tests
        if: ${{ !cancelled() }}
        run: npm run test:cucumber
        # Uncomment to run only specific tags
        # run: npx cucumber-js --tags "@Regression"

      - name: Upload Test Artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-artifacts
          path: |
            videos/
            traces/
            screenshots/
            test-results/
            html-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure Results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-results
          path: allure-results/
          include-hidden-files: true
          retention-days: 14

  # Publishes the Allure report to GitHub Pages, only for pushes to main (never for PRs)
  report:
    name: Publish Allure Report
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}allure-report/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Download Allure Results
        uses: actions/download-artifact@v8
        with:
          name: allure-results
          path: allure-results/

      - name: Restore Allure History
        uses: actions/cache/restore@v6
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: allure-history-

      - name: Generate Allure Report
        run: |
          if [ -d allure-history ]; then
            mkdir -p allure-results/history && cp -r allure-history/. allure-results/history/
          fi
          npx allure generate ./allure-results --clean -o ./_site/allure-report
          # Carry trend history forward to the next run
          rm -rf allure-history && cp -r ./_site/allure-report/history allure-history
          # Site root redirects to the report
          printf '<!DOCTYPE html><meta http-equiv="refresh" content="0; url=allure-report/"><a href="allure-report/">Allure report</a>\n' > ./_site/index.html

      - name: Save Allure History
        uses: actions/cache/save@v6
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
