<!DOCTYPE html>
<!--
  Example Application Fixture

  A small, self-contained page used by the example Cucumber scenarios and
  Playwright specs. It gives the template a deterministic target so the
  examples pass in CI without depending on an external site.

  Replace it by pointing config/testConfig.json "url" (or the BASE_URL
  environment variable) at your real application.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Example Application</title>
</head>
<body>
    <h1>Example Application</h1>

    <button id="example-button" type="button">Run example action</button>
    <div id="result" hidden>Example action completed</div>
    <div id="success-message" hidden>Success</div>

    <form id="example-form">
        <label for="example-input">Example input</label>
        <input id="example-input" name="example" type="text">
        <button id="submit-button" type="submit">Submit</button>
    </form>
    <div id="message" role="status"></div>

    <script>
        document.getElementById('example-button').addEventListener('click', () => {
            document.getElementById('result').hidden = false;
            document.getElementById('success-message').hidden = false;
        });

        document.getElementById('example-form').addEventListener('submit', (event) => {
            event.preventDefault();
            const value = document.getElementById('example-input').value.trim();
            document.getElementById('message').textContent = value
                ? 'Form submitted successfully'
                : 'Please enter a value';
        });
    </script>
</body>
</html>
